name: Publish LACE v1.1.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-lace-v1.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.1.0
          RELEASE_COMMIT: 3f6f8fbda7c90f98737cb0d64fccf3e2783e8ecc
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            actual_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            test "${actual_commit}" = "${RELEASE_COMMIT}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "LACE v1.1.0"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "LACE v1.1.0" \
              --notes-file systems/sys-001-lace/releases/v1.1.0/release-notes.md
          fi

          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${RELEASE_COMMIT}"
          gh release view "${RELEASE_TAG}" --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == "v1.1.0" and .isDraft == false and .isPrerelease == false)'
