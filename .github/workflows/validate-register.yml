name: Validate register, LACE, and EnablementOps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - run: python scripts/validate_register.py
      - run: python scripts/validate_enablementops.py
      - run: python -m unittest -v scripts/test_validate_enablementops.py
      - run: python scripts/validate_lace.py
      - run: python -m unittest -v scripts/test_validate_lace_pilots.py
      - run: python scripts/validate_lace_pilots.py
