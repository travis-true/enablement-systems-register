namespace:
  decision_id: LACE-NDR-001
  system_id: SYS-001
  prefix: LACE-TMP
  id_pattern: "^LACE-TMP-[0-9]{3}$"
  version: 1.0.0
  status: approved
  effective_date: 2026-09-02
  owner: Travis True
  next_number_policy: next-unused-in-family-range
  reuse_retired_ids: false

ranges:
  - range: "001-099"
    family: system-control-and-lifecycle
  - range: "100-199"
    family: performance-support-and-documentation
  - range: "200-299"
    family: instructor-led-and-virtual
  - range: "300-399"
    family: self-paced-digital
  - range: "400-499"
    family: video-and-multimedia
  - range: "500-599"
    family: communications-and-adoption
  - range: "600-699"
    family: planning-and-evaluation
  - range: "700-899"
    family: reserved
  - range: "900-999"
    family: migration-compatibility-exception

allowed_statuses:
  - planned
  - active
  - deprecated
  - retired
  - superseded

